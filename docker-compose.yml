# Rotina Viva: Streamlit + DuckDB + ChromaDB.
# LLM e embeddings vêm de API (OpenRouter / OpenAI) — configure .env (ROTINA_CHAT_PROVIDER, ROTINA_EMBED_PROVIDER, chaves).
# Para Ollama local, rode o daemon na máquina e use ROTINA_*_PROVIDER=ollama (fora deste compose).

services:
  rotina-viva:
    build: .
    container_name: rotina-viva
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      ROTINA_DATA_DIR: /data
      CHROMA_PERSIST_DIR: /data/chroma
    volumes:
      - ./data:/data
    restart: unless-stopped
